name: Deploy Next.js App to VPS

on:
  push:
    branches:
      - deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # ১. NVM লোড করা
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 24

            # ২. ফোল্ডার চেক করা (না থাকলে Clone করবে, থাকলে Pull করবে)
            if [ ! -d "$HOME/Portfolio" ]; then
              echo "Project directory does not exist. Cloning repository..."
              git clone -b deployment https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git $HOME/Portfolio
              cd $HOME/Portfolio
              npm install
              npm run build
              pm2 start npm --name "portfolio:3000" -- run start
            else
              echo "Project directory exists. Pulling latest code..."
              cd $HOME/Portfolio
              git pull origin deployment
              npm install
              npm run build
              pm2 restart portfolio:3000
            fi